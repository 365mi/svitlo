<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Світло • Черга 6(1)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0e12;
      --card-2: #12151c;
      --border: #1e232d;
      --text: #f3f4f6;
      --muted: #8b949e;
      --green: #22c55e;
      --green-dark: #15803d;
      --red: #ef4444;
      --red-dark: #b91c1c;
      --amber: #f59e0b;
      --blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 12px 12px 20px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      padding: 2px 2px 4px;
    }

    .h-left {
      justify-self: start;
      min-width: 0;
    }

    .queue-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      line-height: 1.2;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 6px rgba(34, 197, 94, 0.7); }
    .dot.cache { background: var(--amber); box-shadow: 0 0 6px rgba(245, 158, 11, 0.7); }

    .h-center {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #171a21;
      border: 1px solid #282e3a;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      user-select: none;
      white-space: nowrap;
    }

    .day-nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }

    .day-nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .live-clock {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      line-height: 1.1;
    }

    .h-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .all-queues-btn {
      height: 35px;
      padding: 0 9px;
      border-radius: 999px;
      background: #14171f;
      border: 1px solid #262c38;
      color: #e5e7eb;
      font-size: 11.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .all-queues-btn:active {
      background: #1f2430;
    }

    .refresh-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #14171f;
      border: 1px solid #262c38;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .refresh-btn:active {
      background: #1f2430;
    }

    .refresh-btn.spinning svg {
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .hero-card.state-on {
      border-color: rgba(34, 197, 94, 0.35);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.07) 0%, #0b0d11 100%);
    }

    .hero-card.state-off {
      border-color: rgba(239, 68, 68, 0.38);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, #0b0d11 100%);
    }

    .state-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .state-badge .big-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .state-on .state-badge { color: var(--green); }
    .state-on .big-dot { background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.8); }

    .state-off .state-badge { color: var(--red); }
    .state-off .big-dot { background: var(--red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.8); }

    .countdown-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 10px;
    }

    .cd-col-left {
      padding-right: 8px;
      border-right: 1px solid #1f2430;
    }

    .cd-col-right {
      padding-left: 4px;
    }

    .cd-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .state-on .cd-col-left .cd-label,
    .state-off .cd-col-left .cd-label {
      color: #4ade80;
    }

    .cd-time-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cd-main-time {
      font-size: 31px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.6px;
      font-variant-numeric: tabular-nums;
    }

    .state-on .cd-main-time { color: var(--red); }
    .state-off .cd-main-time { color: var(--green); }

    .cd-duration {
      font-size: 12.5px;
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .cd-remaining {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .ranges-section {
      border-top: 1px solid #191e27;
      padding-top: 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranges-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .ranges-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      line-height: 1.4;
      color: #d1d5db;
    }

    .ranges-title {
      color: var(--muted);
      font-weight: 600;
      margin-right: 1px;
    }

    .r-item {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: #141820;
      border: 1px solid #232936;
      color: #d1d5db;
    }

    .r-item.past {
      opacity: 0.52;
    }

    .r-item.active-now {
      background: rgba(239, 68, 68, 0.26);
      border: 1px solid #ef4444;
      color: #ffffff;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }

    .r-item.next-up {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-weight: 700;
    }

    .diff-pills-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .diff-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .diff-pill.light-removed {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #f87171;
    }

    .diff-pill.light-added {
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.42);
      color: #4ade80;
    }

    .uz-link {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #132030;
      border: 1px solid #1e3550;
      color: var(--blue);
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      margin-top: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
    }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .stat-dot.g { background: var(--green); }
    .stat-dot.r { background: var(--red); }

    .pct-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #4ade80;
    }

    .stat-val {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .stat-val.g { color: var(--green); }
    .stat-val.r { color: var(--red); }

    .grid-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
    }

    .hours-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .hour-tile {
      position: relative;
      height: 54px;
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hour-tile.past {
      opacity: 0.44;
    }

    .hour-tile.current {
      opacity: 1;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.22);
    }

    .tile-halves {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .half.on-base { background: #16a34a; }
    .half.off-base { background: #dc2626; }

    .half.on-canceled {
      background: repeating-linear-gradient(
        -45deg,
        #16a34a,
        #16a34a 5px,
        #0d5c2b 5px,
        #0d5c2b 10px
      );
    }

    .half.off-added {
      background: repeating-linear-gradient(
        -45deg,
        #dc2626,
        #dc2626 5px,
        #7f1d1d 5px,
        #7f1d1d 10px
      );
    }

    .tile-label {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      font-variant-numeric: tabular-nums;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 2px 0;
      font-size: 10.5px;
      color: var(--muted);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .leg-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .leg-box {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
      flex-shrink: 0;
    }

    .leg-box.g { background: #16a34a; }
    .leg-box.r { background: #dc2626; }
    .leg-box.gs {
      background: repeating-linear-gradient(-45deg, #16a34a, #16a34a 2.5px, #0d5c2b 2.5px, #0d5c2b 5px);
    }
    .leg-box.rs {
      background: repeating-linear-gradient(-45deg, #dc2626, #dc2626 2.5px, #7f1d1d 2.5px, #7f1d1d 5px);
    }

    .auto-tag {
      color: var(--blue);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Compact All-Queues Modal (Fits all 12 queues on one screen without scrolling) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 460px;
      max-height: 96vh;
      background: #0b0d11;
      border: 1px solid #262c38;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #1c212b;
      background: #101319;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .modal-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #191d26;
      border: 1px solid #2a3140;
      color: #e5e7eb;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 5px 8px 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .q-table-head {
      display: grid;
      grid-template-columns: 62px 58px 74px 1fr;
      align-items: center;
      padding: 1px 6px 2px;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    .q-row {
      background: #11141b;
      border: 1px solid #1b202b;
      border-radius: 8px;
      padding: 4px 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .q-row.my-queue {
      border-color: rgba(56, 189, 248, 0.65);
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.12) 0%, #11141b 100%);
    }

    .q-row-top {
      display: grid;
      grid-template-columns: 62px 58px 74px 1fr;
      align-items: center;
      font-size: 11.5px;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .q-name {
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .q-you-tag {
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 3.5px;
      border-radius: 3px;
      background: rgba(56, 189, 248, 0.22);
      color: var(--blue);
    }

    .q-now {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .q-now.on { color: var(--green); }
    .q-now.off { color: var(--red); }

    .q-off-val {
      font-weight: 800;
      color: var(--red);
    }

    .q-on-val {
      font-weight: 700;
      color: var(--green);
      text-align: right;
    }

    .q-timeline {
      position: relative;
      height: 3.5px;
      border-radius: 999px;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(48, 1fr);
      background: #16a34a;
    }

    .q-tl-slot.off {
      background: #dc2626;
    }

    .q-tl-slot.on {
      background: #16a34a;
    }

    .q-now-pin {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: #ffffff;
      z-index: 2;
    }

    .q-intervals-line {
      font-size: 10px;
      color: #9ca3af;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="h-left">
        <div class="queue-title">Черга 6(1)</div>
        <div class="sync-status">
          <span class="dot ok" id="syncDot"></span>
          <span id="syncText">Оновлення...</span>
        </div>
      </div>

      <div class="h-center">
        <div class="date-pill">
          <button class="day-nav-btn" id="prevDayBtn" aria-label="Попередній день" style="display:none;">‹</button>
          <span id="dateLabel">—</span>
          <button class="day-nav-btn" id="nextDayBtn" aria-label="Наступний день" style="display:none;">›</button>
        </div>
        <div class="live-clock" id="liveClock">--:--:--</div>
      </div>

      <div class="h-right">
        <button class="all-queues-btn" id="allQueuesBtn" aria-label="Всі черги">
          <span>⊞</span>
          <span>Черги</span>
        </button>
        <button class="refresh-btn" id="refreshBtn" aria-label="Оновити">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
    </header>

    <section class="hero-card state-on" id="heroCard">
      <div class="state-badge">
        <span class="big-dot"></span>
        <span id="stateBadgeText">ЗАВАНТАЖЕННЯ...</span>
      </div>

      <div class="countdown-grid">
        <div class="cd-col-left">
          <div class="cd-label" id="nextEventLabel">ВІДКЛЮЧЕННЯ О</div>
          <div class="cd-time-row">
            <span class="cd-main-time" id="nextEventTime">--:--</span>
            <span class="cd-duration" id="nextEventDuration"></span>
          </div>
        </div>
        <div class="cd-col-right">
          <div class="cd-label" id="remainingLabel">ДО ВІДКЛЮЧЕННЯ</div>
          <div class="cd-remaining" id="remainingTime">—</div>
        </div>
      </div>

      <div class="ranges-section">
        <div class="ranges-top-row">
          <div class="ranges-wrap" id="rangesWrap"></div>
          <a class="uz-link" href="https://www.uz.gov.ua/about/activity/electropostachannia/electro_consumers/temporary_shutdown/grafikiobmezhen/622368/" target="_blank" rel="noopener">УЗ ↗</a>
        </div>
        <div class="diff-pills-row" id="diffPillsRow" style="display:none;"></div>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-top">
          <span class="stat-label"><span class="stat-dot g"></span>Зі світлом</span>
          <span class="pct-badge" id="onPctBadge">0%</span>
        </div>
        <div class="stat-val g" id="onTotalText">0 год</div>
      </div>
      <div class="stat-card">
        <div class="stat-top">
          <span class="stat-label"><span class="stat-dot r"></span>Без світла</span>
        </div>
        <div class="stat-val r" id="offTotalText">0 год</div>
      </div>
    </section>

    <section class="grid-card">
      <div class="hours-grid" id="hoursGrid"></div>
    </section>

    <footer class="footer">
      <div class="legend">
        <span class="leg-item"><span class="leg-box g"></span>Є</span>
        <span class="leg-item"><span class="leg-box r"></span>Немає</span>
        <span class="leg-item"><span class="leg-box gs"></span>Скасували відкл.</span>
        <span class="leg-item"><span class="leg-box rs"></span>Додали відкл.</span>
      </div>
      <span class="auto-tag" id="autoCountdown">Авто 15:00</span>
    </footer>
  </div>

  <div class="modal-overlay" id="queuesModal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle">Усі черги • Статистика</div>
          <div class="modal-sub" id="modalSub">Тернопільська область</div>
        </div>
        <button class="modal-close" id="modalCloseBtn" aria-label="Закрити">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const TARGET_QUEUE = "6(1)";
    const ALL_QUEUES = [
      "1(1)", "1(2)", "2(1)", "2(2)", "3(1)", "3(2)",
      "4(1)", "4(2)", "5(1)", "5(2)", "6(1)", "6(2)"
    ];
    const MONTHS_UA = [
      "січня", "лютого", "березня", "квітня", "травня", "червня",
      "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"
    ];

    let appData = null;
    let selectedDayIdx = 0;
    let lastRenderedMinuteKey = "";
    let lastAutoReloadTs = Date.now();

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#000000");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#000000");
    }

    function getKyivNow() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Kyiv",
        year: "numeric",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(now);

      const map = {};
      for (const p of parts) {
        if (p.type !== "literal") map[p.type] = parseInt(p.value, 10);
      }
      const hour = map.hour === 24 ? 0 : map.hour;
      return {
        year: map.year,
        month: map.month,
        day: map.day,
        hour,
        minute: map.minute,
        second: map.second,
        totalMins: hour * 60 + map.minute,
        dateLabel: `${map.day} ${MONTHS_UA[map.month - 1]}`
      };
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function slotToStr(idx) {
      if (idx >= 48) return "24:00";
      const h = Math.floor(idx / 2);
      const m = idx % 2 === 0 ? "00" : "30";
      return `${pad2(h)}:${m}`;
    }

    function formatDuration(mins) {
      if (mins <= 0) return "0 хв";
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h > 0 && m > 0) return `${h} год ${m} хв`;
      if (h > 0) return `${h} год`;
      return `${m} хв`;
    }

    function formatDurationShort(mins) {
      if (mins <= 0) return "0 год";
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h > 0 && m > 0) return `${h}г ${m}хв`;
      if (h > 0) return `${h} год`;
      return `${m} хв`;
    }

    function slotsToIntervals(arr) {
      const list = [];
      let start = null;
      for (let i = 0; i <= 48; i++) {
        const val = i < 48 ? arr[i] : 0;
        if (val === 1 && start === null) {
          start = i;
        } else if (val === 0 && start !== null) {
          list.push({
            startIdx: start,
            endIdx: i,
            startMins: start * 30,
            endMins: i * 30,
            label: `${slotToStr(start)}–${slotToStr(i)}`
          });
          start = null;
        }
      }
      return list;
    }

    function updateAutoTimer() {
      const el = document.getElementById("autoCountdown");
      const PERIOD_SEC = 15 * 60;
      let baseMs = lastAutoReloadTs;

      if (appData && appData.updated_at) {
        const parsed = Date.parse(appData.updated_at);
        if (!isNaN(parsed)) baseMs = parsed;
      }

      const elapsedSec = Math.max(0, Math.floor((Date.now() - baseMs) / 1000));
      const remSec = PERIOD_SEC - (elapsedSec % PERIOD_SEC);
      const mm = Math.floor(remSec / 60);
      const ss = remSec % 60;
      el.textContent = `Авто ${pad2(mm)}:${pad2(ss)}`;

      if (remSec === PERIOD_SEC && Date.now() - lastAutoReloadTs > 10000) {
        lastAutoReloadTs = Date.now();
        loadData(false);
      }
    }

    function updateClockOnly() {
      const k = getKyivNow();
      document.getElementById("liveClock").textContent =
        `${pad2(k.hour)}:${pad2(k.minute)}:${pad2(k.second)}`;

      updateAutoTimer();

      const minKey = `${k.day}-${k.hour}-${k.minute}`;
      if (appData && minKey !== lastRenderedMinuteKey) {
        lastRenderedMinuteKey = minKey;
        render();
        if (document.getElementById("queuesModal").classList.contains("open")) {
          renderAllQueuesModal();
        }
      }
    }

    function render() {
      if (!appData || !Array.isArray(appData.days) || appData.days.length === 0) {
        return;
      }

      const k = getKyivNow();
      if (selectedDayIdx >= appData.days.length) selectedDayIdx = 0;

      const syncDot = document.getElementById("syncDot");
      const syncText = document.getElementById("syncText");
      if (appData.source_ok) {
        syncDot.className = "dot ok";
        syncText.textContent = `УЗ • ${appData.updated_str || ""}`;
      } else {
        syncDot.className = "dot cache";
        syncText.textContent = `Кеш • ${appData.updated_str || ""}`;
      }

      const dayObj = appData.days[selectedDayIdx];
      document.getElementById("dateLabel").textContent = dayObj.date;
      const prevBtn = document.getElementById("prevDayBtn");
      const nextBtn = document.getElementById("nextDayBtn");
      if (appData.days.length > 1) {
        prevBtn.style.display = "inline-block";
        nextBtn.style.display = "inline-block";
        prevBtn.disabled = selectedDayIdx === 0;
        nextBtn.disabled = selectedDayIdx === appData.days.length - 1;
      } else {
        prevBtn.style.display = "none";
        nextBtn.style.display = "none";
      }

      const qData = (dayObj.queues && dayObj.queues[TARGET_QUEUE]) || {
        baseline: new Array(48).fill(0),
        current: new Array(48).fill(0)
      };
      const cur = qData.current;
      const base = qData.baseline || cur;
      const isToday = dayObj.date === k.dateLabel;

      const combinedSlots = [];
      for (let d = selectedDayIdx; d < appData.days.length; d++) {
        const dq = appData.days[d].queues && appData.days[d].queues[TARGET_QUEUE];
        if (dq && Array.isArray(dq.current)) {
          combinedSlots.push(...dq.current);
        }
      }

      const curSlotIdx = isToday ? Math.min(47, Math.floor(k.totalMins / 30)) : 0;
      const isOffNow = isToday ? cur[curSlotIdx] === 1 : false;

      const heroCard = document.getElementById("heroCard");
      const stateBadgeText = document.getElementById("stateBadgeText");
      const nextEventLabel = document.getElementById("nextEventLabel");
      const nextEventTime = document.getElementById("nextEventTime");
      const nextEventDuration = document.getElementById("nextEventDuration");
      const remainingLabel = document.getElementById("remainingLabel");
      const remainingTime = document.getElementById("remainingTime");

      if (!isToday) {
        const intervals = slotsToIntervals(cur);
        heroCard.className = "hero-card state-on";
        stateBadgeText.textContent = `ПРОГНОЗ НА ${dayObj.date.toUpperCase()}`;
        if (intervals.length > 0) {
          const first = intervals[0];
          const durMins = (first.endIdx - first.startIdx) * 30;
          nextEventLabel.textContent = "ПЕРШЕ ВІДКЛЮЧЕННЯ";
          nextEventTime.textContent = slotToStr(first.startIdx);
          nextEventDuration.textContent = `(на ${formatDuration(durMins)})`;
          remainingLabel.textContent = "ВСЬОГО ВІДКЛЮЧЕНЬ";
          remainingTime.textContent = `${intervals.length} рази`;
        } else {
          nextEventLabel.textContent = "ВІДКЛЮЧЕННЯ";
          nextEventTime.textContent = "Немає";
          nextEventDuration.textContent = "";
          remainingLabel.textContent = "СТАТУС";
          remainingTime.textContent = "Весь день зі світлом";
        }
      } else if (isOffNow) {
        heroCard.className = "hero-card state-off";
        stateBadgeText.textContent = "ЗАРАЗ БЕЗ СВІТЛА";
        nextEventLabel.textContent = "СВІТЛО О";
        remainingLabel.textContent = "ДО ВКЛЮЧЕННЯ";

        let changeIdx = null;
        for (let i = curSlotIdx + 1; i < combinedSlots.length; i++) {
          if (combinedSlots[i] === 0) {
            changeIdx = i;
            break;
          }
        }

        if (changeIdx !== null) {
          const targetMins = changeIdx * 30;
          const remMins = Math.max(1, targetMins - k.totalMins);
          let onSlots = 0;
          for (let j = changeIdx; j < combinedSlots.length; j++) {
            if (combinedSlots[j] === 0) onSlots++;
            else break;
          }
          const reachesEnd = changeIdx + onSlots >= combinedSlots.length;
          nextEventTime.textContent = slotToStr(changeIdx % 48);
          nextEventDuration.textContent = reachesEnd
            ? `(до кінця доби)`
            : `(на ${formatDuration(onSlots * 30)})`;
          remainingTime.textContent = formatDuration(remMins);
        } else {
          nextEventTime.textContent = "24:00";
          nextEventDuration.textContent = "";
          remainingTime.textContent = formatDuration(Math.max(1, 1440 - k.totalMins));
        }
      } else {
        heroCard.className = "hero-card state-on";
        stateBadgeText.textContent = "ЗАРАЗ Є СВІТЛО";
        nextEventLabel.textContent = "ВІДКЛЮЧЕННЯ О";
        remainingLabel.textContent = "ДО ВІДКЛЮЧЕННЯ";

        let changeIdx = null;
        for (let i = curSlotIdx + 1; i < combinedSlots.length; i++) {
          if (combinedSlots[i] === 1) {
            changeIdx = i;
            break;
          }
        }

        if (changeIdx !== null) {
          const targetMins = changeIdx * 30;
          const remMins = Math.max(1, targetMins - k.totalMins);
          let offSlots = 0;
          for (let j = changeIdx; j < combinedSlots.length; j++) {
            if (combinedSlots[j] === 1) offSlots++;
            else break;
          }
          nextEventTime.textContent = slotToStr(changeIdx % 48);
          nextEventDuration.textContent = `(на ${formatDuration(offSlots * 30)})`;
          remainingTime.textContent = formatDuration(remMins);
        } else {
          nextEventTime.textContent = "Немає";
          nextEventDuration.textContent = "";
          remainingTime.textContent = "До кінця доби";
        }
      }

      const intervals = slotsToIntervals(cur);
      const rangesWrap = document.getElementById("rangesWrap");
      rangesWrap.innerHTML = `<span class="ranges-title">Відключення:</span>`;

      if (intervals.length === 0) {
        rangesWrap.innerHTML += `<span class="r-item">не заплановано</span>`;
      } else {
        let markedNext = false;
        intervals.forEach((iv) => {
          const span = document.createElement("span");
          span.className = "r-item";
          span.textContent = iv.label;

          if (isToday) {
            if (k.totalMins >= iv.startMins && k.totalMins < iv.endMins) {
              span.classList.add("active-now");
            } else if (k.totalMins >= iv.endMins) {
              span.classList.add("past");
            } else if (!isOffNow && !markedNext) {
              span.classList.add("next-up");
              markedNext = true;
            }
          }
          rangesWrap.appendChild(span);
        });
      }

      const lightRemovedArr = cur.map((v, i) => (v === 1 && base[i] === 0 ? 1 : 0));
      const lightAddedArr = cur.map((v, i) => (v === 0 && base[i] === 1 ? 1 : 0));
      const lightRemovedIntervals = slotsToIntervals(lightRemovedArr);
      const lightAddedIntervals = slotsToIntervals(lightAddedArr);
      const diffRow = document.getElementById("diffPillsRow");
      diffRow.innerHTML = "";

      if (lightRemovedIntervals.length > 0 || lightAddedIntervals.length > 0) {
        diffRow.style.display = "flex";
        if (lightRemovedIntervals.length > 0) {
          const p = document.createElement("span");
          p.className = "diff-pill light-removed";
          p.textContent = "-" + lightRemovedIntervals.map((x) => x.label).join(", ");
          diffRow.appendChild(p);
        }
        if (lightAddedIntervals.length > 0) {
          const p = document.createElement("span");
          p.className = "diff-pill light-added";
          p.textContent = "+" + lightAddedIntervals.map((x) => x.label).join(", ");
          diffRow.appendChild(p);
        }
      } else {
        diffRow.style.display = "none";
      }

      const offCount = cur.reduce((acc, v) => acc + (v === 1 ? 1 : 0), 0);
      const onCount = 48 - offCount;
      const onPct = Math.round((onCount / 48) * 100);
      document.getElementById("onPctBadge").textContent = `${onPct}%`;
      document.getElementById("onTotalText").textContent = formatDuration(onCount * 30);
      document.getElementById("offTotalText").textContent = formatDuration(offCount * 30);

      const hoursGrid = document.getElementById("hoursGrid");
      hoursGrid.innerHTML = "";

      for (let h = 0; h < 24; h++) {
        const s1 = h * 2;
        const s2 = h * 2 + 1;
        const tile = document.createElement("div");
        tile.className = "hour-tile";

        if (isToday) {
          if (h < k.hour) tile.classList.add("past");
          else if (h === k.hour) tile.classList.add("current");
        }

        const getHalfClass = (idx) => {
          const c = cur[idx];
          const b = base[idx];
          if (c === 1 && b === 0) return "off-added";
          if (c === 0 && b === 1) return "on-canceled";
          return c === 1 ? "off-base" : "on-base";
        };

        const isOffHour = cur[s1] === 1 && cur[s2] === 1;

        tile.innerHTML = `
          <div class="tile-halves">
            <div class="half ${getHalfClass(s1)}"></div>
            <div class="half ${getHalfClass(s2)}"></div>
          </div>
          <div class="tile-label">
            <span style="opacity:${isOffHour ? '0.65' : '1'}">${isOffHour ? '✕' : '⚡'}</span>
            <span>${pad2(h)}:00</span>
          </div>
        `;
        hoursGrid.appendChild(tile);
      }
    }

    function renderAllQueuesModal() {
      if (!appData || !Array.isArray(appData.days) || appData.days.length === 0) return;
      const k = getKyivNow();
      const dayObj = appData.days[selectedDayIdx] || appData.days[0];
      const isToday = dayObj.date === k.dateLabel;
      const curSlotIdx = Math.min(47, Math.floor(k.totalMins / 30));
      const nowPct = Math.min(99.5, Math.max(0.5, (k.totalMins / 1440) * 100));

      document.getElementById("modalTitle").textContent = `Усі черги • ${dayObj.date}`;

      let totalOffMinsAll = 0;
      const rowsHtml = ALL_QUEUES.map((qName) => {
        const qObj = (dayObj.queues && dayObj.queues[qName]) || { current: new Array(48).fill(0) };
        const arr = qObj.current || new Array(48).fill(0);
        const offSlots = arr.reduce((a, v) => a + (v === 1 ? 1 : 0), 0);
        const onSlots = 48 - offSlots;
        const offMins = offSlots * 30;
        const onMins = onSlots * 30;
        totalOffMinsAll += offMins;

        const isOffNow = isToday ? arr[curSlotIdx] === 1 : null;
        const intervals = slotsToIntervals(arr);
        const rangesTxt = intervals.length > 0 ? intervals.map((x) => x.label).join(", ") : "відключень немає";
        const isMine = qName === TARGET_QUEUE;

        let nowHtml = `<span class="q-now" style="color:var(--muted)">—</span>`;
        if (isToday) {
          nowHtml = isOffNow
            ? `<span class="q-now off">● Немає</span>`
            : `<span class="q-now on">● Є</span>`;
        }

        const timelineSlots = arr
          .map((v) => `<span class="q-tl-slot ${v === 1 ? 'off' : 'on'}"></span>`)
          .join("");
        const pinHtml = isToday ? `<span class="q-now-pin" style="left:${nowPct}%"></span>` : "";

        return `
          <div class="q-row ${isMine ? 'my-queue' : ''}">
            <div class="q-row-top">
              <div class="q-name">${qName} ${isMine ? '<span class="q-you-tag">ВИ</span>' : ''}</div>
              <div>${nowHtml}</div>
              <div class="q-off-val">-${formatDurationShort(offMins)}</div>
              <div class="q-on-val">+${formatDurationShort(onMins)}</div>
            </div>
            <div class="q-timeline">
              ${timelineSlots}
              ${pinHtml}
            </div>
            <div class="q-intervals-line">${rangesTxt}</div>
          </div>
        `;
      }).join("");

      const avgOffMins = Math.round((totalOffMinsAll / ALL_QUEUES.length) / 30) * 30;
      document.getElementById("modalSub").textContent =
        `Середньо по області: без світла ${formatDuration(avgOffMins)}`;

      document.getElementById("modalBody").innerHTML = `
        <div class="q-table-head">
          <span>Черга</span>
          <span>Зараз</span>
          <span>Без світла</span>
          <span style="text-align:right">Зі світлом</span>
        </div>
        ${rowsHtml}
      `;
    }

    async function loadData(manual = false) {
      const btn = document.getElementById("refreshBtn");
      if (manual) btn.classList.add("spinning");
      lastAutoReloadTs = Date.now();
      try {
        const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
        if (res.ok) {
          appData = await res.json();
          const k = getKyivNow();
          lastRenderedMinuteKey = `${k.day}-${k.hour}-${k.minute}`;
          render();
          updateAutoTimer();
          if (document.getElementById("queuesModal").classList.contains("open")) {
            renderAllQueuesModal();
          }
        }
      } catch (e) {
        console.error(e);
      } finally {
        if (manual) {
          setTimeout(() => btn.classList.remove("spinning"), 450);
        }
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => loadData(true));
    document.getElementById("prevDayBtn").addEventListener("click", () => {
      if (selectedDayIdx > 0) {
        selectedDayIdx--;
        render();
      }
    });
    document.getElementById("nextDayBtn").addEventListener("click", () => {
      if (appData && selectedDayIdx < appData.days.length - 1) {
        selectedDayIdx++;
        render();
      }
    });

    const modal = document.getElementById("queuesModal");
    document.getElementById("allQueuesBtn").addEventListener("click", () => {
      renderAllQueuesModal();
      modal.classList.add("open");
    });
    document.getElementById("modalCloseBtn").addEventListener("click", () => {
      modal.classList.remove("open");
    });
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    updateClockOnly();
    setInterval(updateClockOnly, 1000);
    loadData(false);
    setInterval(() => loadData(false), 60000);
  </script>
</body>
</html>
