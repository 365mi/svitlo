<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="monetag" content="b7981e6d39fbf8418ecd653ef26b9815" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Світло УЗ" />
  <title>Світло УЗ • Графік відключень</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0e12;
      --card-2: #12151c;
      --border: #1e232d;
      --text: #f3f4f6;
      --muted: #8b949e;
      --green: #22c55e;
      --green-dark: #15803d;
      --red: #ef4444;
      --red-dark: #b91c1c;
      --amber: #f59e0b;
      --blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 7px 11px 12px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      padding: 0 2px 1px;
    }

    .h-left {
      justify-self: start;
      min-width: 0;
    }

    .queue-select-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #141821;
      border: 1px solid #2b3240;
      border-radius: 10px;
      padding: 2px 7px;
    }

    .queue-select-lbl {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
    }

    .queue-select {
      background: transparent;
      border: none;
      color: var(--blue);
      font-size: 14px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      padding-right: 2px;
    }

    .queue-select option {
      background: #0c0e12;
      color: #ffffff;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
    }

    .dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 6px rgba(34, 197, 94, 0.7); }
    .dot.cache { background: var(--amber); box-shadow: 0 0 6px rgba(245, 158, 11, 0.7); }

    .h-center {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #171a21;
      border: 1px solid #2b3240;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .date-pill:active {
      background: #212631;
      border-color: rgba(56, 189, 248, 0.5);
    }

    .date-hist-icon {
      font-size: 10.5px;
      color: var(--blue);
      opacity: 0.9;
    }

    .live-clock {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      line-height: 1.1;
    }

    .h-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .admin-btn {
      height: 32px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 800;
      display: none;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .all-queues-btn {
      height: 32px;
      padding: 0 8px;
      border-radius: 999px;
      background: #14171f;
      border: 1px solid #262c38;
      color: #e5e7eb;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      white-space: nowrap;
    }

    .refresh-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #14171f;
      border: 1px solid #262c38;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .refresh-btn.spinning svg {
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .hero-card.state-on {
      border-color: rgba(34, 197, 94, 0.35);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.07) 0%, #0b0d11 100%);
    }

    .hero-card.state-off {
      border-color: rgba(239, 68, 68, 0.38);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, #0b0d11 100%);
    }

    .state-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      text-align: center;
    }

    .state-badge .big-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .state-on .state-badge { color: var(--green); }
    .state-on .big-dot { background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.8); }

    .state-off .state-badge { color: var(--red); }
    .state-off .big-dot { background: var(--red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.8); }

    .countdown-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 10px;
    }

    .cd-col-left {
      padding-right: 8px;
      border-right: 1px solid #1f2430;
    }

    .cd-col-right {
      padding-left: 4px;
    }

    .cd-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .state-on .cd-col-left .cd-label,
    .state-off .cd-col-left .cd-label {
      color: #4ade80;
    }

    .cd-time-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px;
    }

    .cd-main-time {
      font-size: 27px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.6px;
      font-variant-numeric: tabular-nums;
    }

    .state-on .cd-main-time { color: var(--red); }
    .state-off .cd-main-time { color: var(--green); }

    .cd-duration {
      font-size: 11.5px;
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .cd-remaining {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .ranges-two-cols {
      border-top: 1px solid #191e27;
      padding-top: 7px;
      display: grid;
      grid-template-columns: 0.86fr 1.14fr;
      gap: 6px;
      align-items: start;
    }

    .r-col-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .r-col-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 7px;
      border-left: 1px solid #1f2430;
      min-width: 0;
    }

    .r-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 17px;
    }

    .ranges-title {
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .r-pills-vert {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3.5px;
    }

    .changes-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      align-items: start;
      width: 100%;
    }

    .changes-col-red {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3.5px;
    }

    .changes-col-green {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3.5px;
    }

    .r-item {
      display: inline-flex;
      align-items: center;
      padding: 1.5px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: #141820;
      border: 1px solid #232936;
      color: #d1d5db;
      white-space: nowrap;
    }

    .r-item.past { opacity: 0.5; }

    .r-item.active-now {
      background: rgba(239, 68, 68, 0.26);
      border: 1px solid #ef4444;
      color: #ffffff;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }

    .r-item.next-up {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-weight: 700;
    }

    .diff-pill {
      display: inline-flex;
      align-items: center;
      padding: 1.5px 5.5px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .diff-pill.
