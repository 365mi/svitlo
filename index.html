<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Світло • Черга 6(1)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0e12;
      --card-2: #12151c;
      --border: #1e232d;
      --text: #f3f4f6;
      --muted: #8b949e;
      --green: #22c55e;
      --green-dark: #15803d;
      --red: #ef4444;
      --red-dark: #b91c1c;
      --amber: #f59e0b;
      --blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 12px 12px 20px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      padding: 2px 2px 4px;
    }

    .h-left {
      justify-self: start;
      min-width: 0;
    }

    .queue-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      line-height: 1.2;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 6px rgba(34, 197, 94, 0.7); }
    .dot.cache { background: var(--amber); box-shadow: 0 0 6px rgba(245, 158, 11, 0.7); }

    .h-center {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #171a21;
      border: 1px solid #282e3a;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      user-select: none;
      white-space: nowrap;
    }

    .day-nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }

    .day-nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .live-clock {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      line-height: 1.1;
    }

    .h-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .all-queues-btn {
      height: 35px;
      padding: 0 9px;
      border-radius: 999px;
      background: #14171f;
      border: 1px solid #262c38;
      color: #e5e7eb;
      font-size: 11.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .all-queues-btn:active {
      background: #1f2430;
    }

    .refresh-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #14171f;
      border: 1px solid #262c38;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .refresh-btn:active {
      background: #1f2430;
    }

    .refresh-btn.spinning svg {
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .hero-card.state-on {
      border-color: rgba(34, 197, 94, 0.35);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.07) 0%, #0b0d11 100%);
    }

    .hero-card.state-off {
      border-color: rgba(239, 68, 68, 0.38);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, #0b0d11 100%);
    }

    .state-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .state-badge .big-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .state-on .state-badge { color: var(--green); }
    .state-on .big-dot { background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.8); }

    .state-off .state-badge { color: var(--red); }
    .state-off .big-dot { background: var(--red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.8); }

    .countdown-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 10px;
    }

    .cd-col-left {
      padding-right: 8px;
      border-right: 1px solid #1f2430;
    }

    .cd-col-right {
      padding-left: 4px;
    }

    .cd-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .state-on .cd-col-left .cd-label,
    .state-off .cd-col-left .cd-label {
      color: #4ade80;
    }

    .cd-time-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cd-main-time {
      font-size: 31px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.6px;
      font-variant-numeric: tabular-nums;
    }

    .state-on .cd-main-time { color: var(--red); }
    .state-off .cd-main-time { color: var(--green); }

    .cd-duration {
      font-size: 12.5px;
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .cd-remaining {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .ranges-section {
      border-top: 1px solid #191e27;
      padding-top: 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranges-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .ranges-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      line-height: 1.4;
      color: #d1d5db;
    }

    .ranges-title {
      color: var(--muted);
      font-weight: 600;
      margin-right: 1px;
    }

    .r-item {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: #141820;
      border: 1px solid #232936;
      color: #d1d5db;
    }

    .r-item.past {
      opacity: 0.52;
    }

    .r-item.active-now {
      background: rgba(239, 68, 68, 0.26);
      border: 1px solid #ef4444;
      color: #ffffff;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }

    .r-item.next-up {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-weight: 700;
    }

    .diff-pills-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .diff-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .diff-pill.light-removed {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #f87171;
    }

    .diff-pill.light-added {
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.42);
      color: #4ade80;
    }

    .uz-link {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #132030;
      border: 1px solid #1e3550;
      color: var(--blue);
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      margin-top: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
    }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .stat-dot.g { background: var(--green); }
    .stat-dot.r { background: var(--red); }

    .pct-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #4ade80;
    }

    .stat-val {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .stat-val.g { color: var(--green); }
    .stat-val.r { color: var(--red); }

    .grid-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
    }

    .hours-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .hour-tile {
      position: relative;
      height: 54px;
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hour-tile.past {
      opacity: 0.44;
    }

    .hour-tile.current {
      opacity: 1;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.22);
    }

    .tile-halves {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .half.on-base { background: #16a34a; }
    .half.off-base { background: #dc2626; }

    .half.on-canceled {
      background: repeating-linear-gradient(
        -45deg,
        #16a34a,
        #16a34a 5px,
        #0d5c2b 5px,
        #0d5c2b 10px
      );
    }

    .half.off-added {
      background: repeating-linear-gradient(
        -45deg,
        #dc2626,
        #dc2626 5px,
        #7f1d1d 5px,
        #7f1d1d 10px
      );
    }

    .tile-label {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      font-variant-numeric: tabular-nums;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 2px 0;
      font-size: 10.5px;
      color: var(--muted);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .leg-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .leg-box {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
      flex-shrink: 0;
    }

    .leg-box.g { background: #16a34a; }
    .leg-box.r { background: #dc2626; }
    .leg-box.gs {
      background: repeating-linear-gradient(-45deg, #16a34a, #16a34a 2.5px, #0d5c2b 2.5px, #0d5c2b 5px);
    }
    .leg-box.rs {
      background: repeating-linear-gradient(-45deg, #dc2626, #dc2626 2.5px, #7f1d1d 2.5px, #7f1d1d 5px);
    }

    .auto-tag {
      color: var(--blue);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Compact All-Queues Modal (Fits all 12 queues on one screen without scrolling) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 460px;
      max-height: 96vh;
      background: #0b0d11;
      border: 1px solid #262c38;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #1c212b;
      background: #101319;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .modal-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #191d26;
      border: 1px solid #2a3140;
      color: #e5e7eb;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 5px 8px 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .q-table-head {
      display: grid;
      grid-template-columns: 62px 58px 74px 1fr;
      align-items: center;
      padding: 1px 6px 2px;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    .q-row {
      background: #11141b;
      border: 1px solid #1b202b;
      border-radius: 8px;
      padding: 4px 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .q-row.my-queue {
      border-color: rgba(56, 189, 248, 0.65);
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.12) 0%, #11141b 100%);
    }

    .q-row-top {
      display: grid;
      grid-template-columns: 62px 58px 74px 1fr;
      align-items: center;
      font-size: 11.5px;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .q-name {
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .q-you-tag {
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 3.5px;
      border-radius: 3px;
      background: rgba(56, 189, 248, 0.22);
      color: var(--blue);
    }

    .q-now {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .q-now.on { color: var(--green); }
    .q-now.off { color: var(--red); }

    .q-off-val {
      font-weight: 800;
      color: var(--red);
    }

    .q-on-val {
      font-weight: 700;
      color: var(--green);
      text-align: right;
    }

    .q-timeline {
      position: relative;
      height: 3.5px;
      border-radius: 999px;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(48, 1fr);
      background: #16a34a;
    }

    .q-tl-slot.off {
      background: #dc2626;
    }

    .q-tl-slot.on {
      background: #16a34a;
    }

    .q-now-pin {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: #ffffff;
      z-index: 2;
    }

    .q-intervals-line {
      font-size: 10px;
      color: #9ca3af;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="h-left">
        <div class="queue-title">Черга 6(1)</div>
        <div class="sync-status">
          <span class="dot ok" id="syncDot"></span>
          <span id="syncText">Оновлення...</span>
        </div>
      </div>

      <div class="h-center">
        <div class="date-pill">
          <button class="day-nav-btn" id="prevDayBtn" aria-label="Попередній день" style="display:none;">‹</button>
          <span id="dateLabel">—</span>
          <button class="day-nav-btn" id="nextDayBtn" aria-label="Наступний день" style="display:none;">›</button>
        </div>
        <div class="live-clock" id="liveClock">--:--:--</div>
      </div>

      <div class="h-right">
        <button class="all-queues-btn" id="allQueuesBtn" aria-label="Всі черги">
          <span>⊞</span>
          <span>Черги</span>
        </button>
        <button class="refresh-btn" id="refreshBtn" aria-label="Оновити">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
    </header>

    <section class="hero-card state-on" id="heroCard">
      <div class="state-badge">
        <span class="big-dot"></span>
        <span id="stateBadgeText">ЗАВАНТАЖЕННЯ...</span>
      </div>

      <div class="countdown-grid">
        <div class="cd-col-left">
          <div class="cd-label" id="nextEventLabel">ВІДКЛЮЧЕННЯ О</div>
          <div class="cd-time-row">
            <span class="cd-main-time" id="nextEventTime">--:--</span>
            <span class="cd-duration" id="nextEventDuration"></span>
          </div>
        </div>
        <div class="cd-col-right">
          <div class="cd-label" id="remainingLabel">ДО ВІДКЛЮЧЕННЯ</div>
          <div class="cd-remaining" id="remainingTime">—</div>
        </div>
      </div>

      <div class="ranges-section">
        <div class="ranges-top-row">
          <div class="ranges-wrap" id="rangesWrap"></div>
          <a class="uz-link" href="https://www.uz.gov.ua/about/activity/electropostachannia/electro_consumers/temporary_shutdown/grafikiobmezhen/622368/" target="_blank" rel="noopener">УЗ ↗</a>
        </div>
        <div class="diff-pills-row" id="diffPillsRow" style="display:none;"></div>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-top">
          <span class="stat-label"><span class="stat-dot g"></span>Зі світлом</span>
          <span class="pct-badge" id="onPctBadge">0%</span>
        </div>
        <div class="stat-val g" id="onTotalText">0 год</div>
      </div>
      <div class="stat-card">
        <div class="stat-top">
          <span class="stat-label"><span class="stat-dot r"></span>Без світла</span>
        </div>
        <div class="stat-val r" id="offTotalText">0 год</div>
      </div>
    </section>

    <section class="grid-card">
      <div class="hours-grid" id="hoursGrid"></div>
    </section>

    <footer class="footer">
      <div class="legend">
        <span class="leg-item"><span class="leg-box g"></span>Є</span>
        <span class="leg-item"><span class="leg-box r"></span>Немає</span>
        <span class="leg-item"><span class="leg-box gs"></span>Скасували відкл.</span>
